<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · ParkSmart AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 p-6 text-slate-900"><main class="mx-auto max-w-7xl bg-white p-8 shadow-sm"><div class="no-print mb-6 flex justify-end"><button id="print-button" class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white">Print</button></div><p class="text-sm font-bold uppercase tracking-widest text-emerald-700">ParkSmart AI</p><h1 class="mt-1 text-3xl font-bold">{{ title }}</h1><p class="mt-2 text-slate-600">{{ start }} to {{ end }} · {{ rows|length }} records</p><div class="mt-6 overflow-x-auto"><table class="min-w-full border-collapse text-xs">{% if rows %}<thead><tr>{% for key in rows[0].keys() %}<th class="border bg-slate-50 px-2 py-2 text-left">{{ key.replace('_',' ')|title }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for value in row.values() %}<td class="border px-2 py-2">{{ value }}</td>{% endfor %}</tr>{% endfor %}</tbody>{% endif %}</table></div></main><script src="{{ url_for('static', filename='js/print.js') }}"></script></body></html>
